<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSS Chat Platform - Đăng nhập</title>

    <link rel="icon" href="images/logo.png" />

    <link rel="stylesheet" href="style/auth-layout.css" />
    <link rel="stylesheet" href="style/banner.css" />
    <link rel="stylesheet" href="style/language.css" />
    <link rel="stylesheet" href="style/auth-common.css" />
    <link rel="stylesheet" href="style/register.css" />
  </head>

  <body>
    <main class="auth-page">
      <!-- Left Banner -->
      <section class="left-panel">
        <img
          class="banner"
          src="images/left_image.png"
          alt="VSS Chat Platform"
        />

        <div class="banner-text">
          <h1 class="banner-title">Hệ thống quản lý chat đa nền tảng</h1>

          <p class="banner-description">
            Tiết kiệm thời gian tư vấn và chăm sóc khách hàng
          </p>
        </div>

        <div class="banner-dots">
          <span class="active"></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <!-- Right -->
      <aside class="right-panel">
        <div class="language">🌐 Tiếng Việt ▼</div>

        <section class="register-card">
          <img src="images/chat_logo.png" alt="VSS Logo" class="logo" />

          <h4 class="register-title">Đăng ký tài khoản</h4>

          <form class="register-form">
            <div class="form-row">
              <div class="form-group">
                <input
                  class="form-input"
                  type="text"
                  placeholder="Nhập họ của bạn"
                />
              </div>

              <div class="form-group">
                <input
                  class="form-input"
                  type="text"
                  placeholder="Nhập tên của bạn"
                />
              </div>
            </div>

            <div class="form-group">
              <input
                class="form-input"
                type="email"
                placeholder="Nhập email làm việc"
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <input
                  class="form-input"
                  type="text"
                  placeholder="Nhập tên công ty"
                />
              </div>

              <div class="form-group select-group">
                <select class="form-input">
                  <option selected disabled>Quốc gia</option>
                  <option>Việt Nam</option>
                  <option>Japan</option>
                  <option>Korea</option>
                </select>
              </div>
            </div>

            <div class="form-group select-group">
              <select class="form-input">
                <option selected disabled>Lĩnh vực</option>
                <option>IT</option>
                <option>Marketing</option>
              </select>
            </div>

            <div class="form-group">
              <input
                class="form-input"
                type="text"
                placeholder="Vị trí làm việc"
              />
            </div>

            <div class="form-group">
              <input
                class="form-input"
                placeholder="Mục đích bạn đến với website"
              ></input>
            </div>

            <button class="primary-button" style="padding: 10px;">Đăng ký</button>
          </form>
          <footer class="register">
            <span style="font-size: 12px;">Bạn đã có tài khoản?</span>

            <a class="register-link" href="login.html"> Đăng nhập </a>
          </footer>
        </section>
      </aside>
    </main>
  </body>
</html>
