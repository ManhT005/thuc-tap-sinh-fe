<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSS Chat Platform</title>

    <link rel="icon" href="images/logo.png" />

    <link rel="stylesheet" href="style/auth-layout.css" />
    <link rel="stylesheet" href="style/banner.css" />
    <link rel="stylesheet" href="style/language.css" />
    <link rel="stylesheet" href="style/auth-common.css" />
    <link rel="stylesheet" href="style/forgot-password.css" />
  </head>

  <body>
    <main class="auth-page">
      <!-- Left Banner -->
      <section class="left-panel">
        <img
          class="banner"
          src="images/left_image.png"
          alt="VSS Chat Platform"
        />

        <div class="banner-text">
          <h1 class="banner-title">Hệ thống quản lý chat đa nền tảng</h1>

          <p class="banner-description">
            Tiết kiệm thời gian tư vấn và chăm sóc khách hàng
          </p>
        </div>

        <div class="banner-dots">
          <span class="active"></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <!-- Right -->
      <aside class="right-panel">
        <div class="language">🌐 Tiếng Việt ▼</div>

        <section class="auth-card">
          <div class="forgot-header">
            <a href="login.html"><span>< Quay lại</span></a>
            <div class="forgot-header-text">Đổi mật khẩu</div>
          </div>
          <img
            class="logo"
            src="images/forgot_password.png"
            alt="VSS Chat Platform"
          />
          <div class="forgot-form">
            <h4 class="forgot-title">Đăng nhập lần đầu</h4>
            <p class="notice-line">
              Đây là lần đầu tiên đăng nhập của bạn, bước đầu tiên bạn cần đổi
              mật khẩu để đảm bảo tính bảo mật cho tài khoản
            </p>

            <form>
              <div class="form-group">
                <label class="sr-only" for="new_password"> Tài khoản </label>

                <input
                  class="form-input"
                  id="new_password"
                  name="username"
                  type="text"
                  placeholder="Nhập mật khẩu mới"
                  autocomplete="username"
                  style="margin-bottom: 16px"
                />
                <label class="sr-only" for="confirm_pasword"> Tài khoản </label>

                <input
                  class="form-input"
                  id="confirm_pasword"
                  name="confirm_pasword"
                  type="text"
                  placeholder="Nhập lại mật khẩu mới"
                  autocomplete="confirm_pasword"
                  style="margin-bottom: 20px"
                />
              </div>

              <button
                class="forgot-button"
                type="button"
              >
                Tiếp tục
              </button>
            </form>
          </div>
        </section>
      </aside>
    </main>
  </body>
</html>
