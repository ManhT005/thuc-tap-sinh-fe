<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSS Chat Platform</title>

    <link rel="icon" href="images/logo.png" />

    <link rel="stylesheet" href="style/auth-layout.css" />
    <link rel="stylesheet" href="style/banner.css" />
    <link rel="stylesheet" href="style/language.css" />
    <link rel="stylesheet" href="style/auth-common.css" />
    <link rel="stylesheet" href="style/forgot-password.css" />
  </head>

  <body>
    <main class="auth-page">
      <!-- Left Banner -->
      <section class="left-panel">
        <img
          class="banner"
          src="images/left_image.png"
          alt="VSS Chat Platform"
        />

        <div class="banner-text">
          <h1 class="banner-title">Hệ thống quản lý chat đa nền tảng</h1>

          <p class="banner-description">
            Tiết kiệm thời gian tư vấn và chăm sóc khách hàng
          </p>
        </div>

        <div class="banner-dots">
          <span class="active"></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <!-- Right -->
      <aside class="right-panel">
        <div class="language">🌐 Tiếng Việt ▼</div>

        <section class="auth-card">
          <div class="forgot-header">
            <a href="forgot_password.html"><span>< Quay lại</span></a>
            <div class="forgot-header-text">Quên mật khẩu</div>
          </div>
          <img
            class="logo"
            src="images/forgot_password.png"
            alt="VSS Chat Platform"
          />
          <div class="forgot-form">
            <h4 class="forgot-title">Kiểm tra mail</h4>
            <p class="notice-line">
              Chúng tôi đã gửi cho bạn mã xác nhận. Vui lòng kiểm tra mã trong
              email của bạn
            </p>

            <form>
              <div class="get-otp">
                <label class="sr-only" for="username"> Tài khoản </label>

                <input
                  class="otp-input"
                  id="otp"
                  name="username"
                  type="text"
                  placeholder="Nhập mã"
                  autocomplete="username"
                />
                <button id="get_otp_btn">Gửi lại mã</button>
              </div>

              <button class="forgot-button" type="button">Tiếp tục</button>
            </form>
          </div>
        </section>
      </aside>
    </main>
  </body>
</html>
