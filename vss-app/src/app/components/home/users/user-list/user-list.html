<section class="page">
  <div class="page-header">
    <div>
      <h2>Danh sách người dùng</h2>
      <p>Quản lý tài khoản người dùng trong hệ thống</p>
    </div>

    <button class="primary-button add-button" (click)="openAdd()">+ Thêm người dùng</button>
  </div>

  <div class="toolbar">

      <div class="search-box">
        <input class="search-input" type="text" placeholder="Tìm theo email..." />
        <button type="button" class="search-button">

            height="18"
            viewBox="0 0 18 18"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"

              maskUnits="userSpaceOnUse"
              x="1"
              y="1"
              width="16"
              height="16"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M1.5 1.5H16.1076V16.1077H1.5V1.5Z"
                fill="white"
              />
            </mask>
            <g mask="url(#mask0_5206_23045)">

                clip-rule="evenodd"

            <mask

              maskUnits="userSpaceOnUse"
              x="12"
              y="13"
              width="5"
              height="5"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M12.9299 13.2793H16.698V17.0404H12.9299V13.2793Z"
                fill="white"
              />
            </mask>
            <g mask="url(#mask1_5206_23045)">
              <path
                fill-rule="evenodd"

          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>Avatar</th>
          <th>Email</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Thao tác</th>
        </tr>
      </thead>

      <tbody>
        @for (user of users(); track user.id) {
          <tr>
            <td>
              <img class="avatar" 
              [src]="user.avatar" 
              [alt]="user.first_name" />
               <!-- <td>{{ user.avatar }}</td> -->
            </td>

            <td>{{ user.email }}</td>
            <td>{{ user.first_name }}</td>
            <td>{{ user.last_name }}</td>

            <td class="action-column">
              <button type="button" class="icon-button edit" (click)="editUser(user)" title="Sửa">

                  class="action-icon"

                  height="18"

                  <path

                  />
                  <path

                    fill="currentColor"
                  />
                </svg>
              </button>

              <button
                type="button"
                class="icon-button delete"
                (click)="deleteUser(user.id)"
                title="Xóa"
              >
                <svg
                  class="action-icon"
                  width="18"
                  height="18"

                  fill="none"

                    fill="currentColor"
                  />
                  <path
                    d="M10.245 12.9375H7.7475C7.44 12.9375 7.185 12.6825 7.185 12.375C7.185 12.0675 7.44 11.8125 7.7475 11.8125H10.245C10.5525 11.8125 10.8075 12.0675 10.8075 12.375C10.8075 12.6825 10.5525 12.9375 10.245 12.9375Z"

                  />
                  <path

            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
<app-user-form
  [visible]="showModal()"
  [user]="selectedUser()"
  (close)="closeModal()"
  (save)="saveUser($event)"
></app-user-form>
