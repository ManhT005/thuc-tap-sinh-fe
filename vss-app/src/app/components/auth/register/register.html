<main class="auth-page">
  <section class="left-panel">
    <img class="banner" src="/images/left_image.png" alt="VSS Chat Platform" />

    <div class="banner-text">
      <h1 class="banner-title">Hệ thống quản lý chat đa nền tảng</h1>
      <p class="banner-description">Tiết kiệm thời gian tư vấn và chăm sóc khách hàng</p>
    </div>

    <div class="banner-dots">
      <span class="active"></span>
      <span></span>
      <span></span>
    </div>
  </section>

  <aside class="right-panel">
    <div class="language">🌐 Tiếng Việt ▼</div>

    <section class="register-card">
      <img src="/images/chat_logo.png" alt="VSS Logo" class="logo" />

      <h4 class="register-title">Đăng ký tài khoản</h4>

      <form class="register-form">
        <div class="form-row">
          <div class="form-group">
            <input class="form-input" type="text" placeholder="Nhập họ của bạn" />
          </div>
          <div class="form-group">
            <input class="form-input" type="text" placeholder="Nhập tên của bạn" />
          </div>
        </div>

        <div class="form-group">
          <input class="form-input" type="email" placeholder="Nhập email làm việc" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <input class="form-input" type="text" placeholder="Nhập tên công ty" />
          </div>
          <div class="form-group select-group">
            <select class="form-input">
              <option selected disabled>Quốc gia</option>
              <option>Việt Nam</option>
              <option>Japan</option>
              <option>Korea</option>
            </select>
          </div>
        </div>

        <div class="form-group select-group">
          <select class="form-input">
            <option selected disabled>Lĩnh vực</option>
            <option>IT</option>
            <option>Marketing</option>
          </select>
        </div>

        <div class="form-group">
          <input class="form-input" type="text" placeholder="Vị trí làm việc" />
        </div>

        <div class="form-group">
          <input class="form-input" placeholder="Mục đích bạn đến với website" />
        </div>

        <button class="primary-button" type="button">Đăng ký</button>
      </form>

      <footer class="register">
        <span>Bạn đã có tài khoản?</span>
        <a class="register-link" routerLink="/login"> Đăng nhập </a>
      </footer>
    </section>
  </aside>
</main>
