<main class="auth-page">
  <section class="left-panel">
    <img class="banner" src="/images/left_image.png" alt="VSS Chat Platform" />

    <div class="banner-text">
      <h1 class="banner-title">Hệ thống quản lý chat đa nền tảng</h1>
      <p class="banner-description">Tiết kiệm thời gian tư vấn và chăm sóc khách hàng</p>
    </div>

    <div class="banner-dots">
      <span class="active"></span>
      <span></span>
      <span></span>
    </div>
  </section>

  <aside class="right-panel">
    <div class="language">🌐 Tiếng Việt ▼</div>

    <section class="auth-card">
      <div class="forgot-header">
        <a routerLink="/login"><span>< Quay lại</span></a>
        <div class="forgot-header-text">Quên mật khẩu</div>
      </div>
      <img class="logo" src="/images/forgot_password.png" alt="VSS Chat Platform" />
      <div class="forgot-form">
        <h4 class="forgot-title">Bạn đã quên mật khẩu?</h4>
        <p class="notice-line">
          Đừng lo lắng, hãy nhập tài khoản hoặc email của bạn ở dưới để tìm kiếm tài khoản của bạn
        </p>

        <form (ngSubmit)="onContinue()">
          <div class="form-group">
            <label class="sr-only" for="username">Tài khoản</label>
            <input
              class="form-input"
              id="username"
              name="username"
              type="text"
              placeholder="Nhập tài khoản/email"
              autocomplete="username"
            />
          </div>

          <button class="primary-button" type="submit">Tiếp tục</button>
        </form>
      </div>
    </section>
  </aside>
</main>
