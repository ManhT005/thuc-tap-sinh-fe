<main class="auth-page">
  <section class="left-panel">
    <img class="banner" src="/images/left_image.png" alt="VSS Chat Platform" />

    <div class="banner-text">
      <h1 class="banner-title">Hệ thống quản lý chat đa nền tảng</h1>
      <p class="banner-description">Tiết kiệm thời gian tư vấn và chăm sóc khách hàng</p>
    </div>

    <div class="banner-dots">
      <span class="active"></span>
      <span></span>
      <span></span>
    </div>
  </section>

  <aside class="right-panel">
    <div class="language">🌐 Tiếng Việt ▼</div>

    <section class="auth-card">
      <div class="forgot-header">
        <a routerLink="/forgot-password"><span>< Quay lại</span></a>
        <div class="forgot-header-text">Quên mật khẩu</div>
      </div>
      <img class="logo" src="/images/forgot_password.png" alt="VSS Chat Platform" />
      <div class="forgot-form">
        <h4 class="forgot-title">Kiểm tra mail</h4>
        <p class="notice-line">
          Chúng tôi đã gửi cho bạn mã xác nhận. Vui lòng kiểm tra mã trong email của bạn
        </p>

        <form (ngSubmit)="onContinue()">
          <div class="get-otp">
            <label class="sr-only" for="otp">Mã xác nhận</label>
            <input
              class="otp-input"
              id="otp"
              name="otp"
              type="text"
              placeholder="Nhập mã"
              autocomplete="one-time-code"
            />
            <button id="get_otp_btn" type="button">Gửi lại mã</button>
          </div>
          <button class="forgot-button" type="submit">Tiếp tục</button>
        </form>
      </div>
    </section>
  </aside>
</main>
